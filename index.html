<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberDrone Lab | Command & Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Tailwind and custom styles/scripts as in your provided code -->
    <!-- ... (all your code unchanged) ... -->
</head>
<body class="flex h-screen w-full">
    <div class="flex flex-col md:flex-row w-full h-full">
        <!-- Map & Drones Section -->
        <div class="flex-1 flex flex-col items-center justify-center bg-blue-50 dark:bg-gray-800 rounded-xl m-4 p-4 relative overflow-hidden">
            <h2 class="text-xl font-bold mb-2 text-blue-900 dark:text-blue-200">خريطة المختبر (تجريبية)</h2>
            <div id="lab-map" class="relative w-full max-w-lg h-80 bg-gradient-to-br from-blue-200 to-blue-400 dark:from-gray-700 dark:to-gray-900 rounded-lg shadow-inner overflow-hidden">
                <!-- Drones and radar icons will be placed here by JS -->
                <img src="https://img.icons8.com/ios-filled/50/000000/drone.png" id="drone1" class="absolute transition-all duration-700" style="top:60px; left:60px; width:40px;" alt="drone"/>
                <img src="https://img.icons8.com/ios-filled/50/ff0000/drone.png" id="intruder" class="absolute transition-all duration-700 hidden" style="top:180px; left:320px; width:40px;" alt="intruder drone"/>
                <img src="https://img.icons8.com/ios-filled/50/1e40af/radar.png" class="absolute" style="top:120px; left:200px; width:48px;" alt="radar"/>
                <div id="jam-effect" class="absolute w-full h-full bg-red-400 bg-opacity-30 hidden" style="top:0; left:0;"></div>
            </div>
            <div class="flex gap-2 mt-4">
                <button onclick="startMission()" class="bg-blue-700 text-white px-4 py-2 rounded hover:bg-blue-900">بدء المهمة</button>
                <button onclick="showIntruder()" class="bg-yellow-500 text-white px-4 py-2 rounded hover:bg-yellow-700">محاكاة درون معادٍ</button>
                <button onclick="activateJamming()" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-800">تشويش إلكتروني</button>
                <button onclick="resetDemo()" class="bg-gray-400 text-white px-4 py-2 rounded hover:bg-gray-600">إعادة تعيين</button>
            </div>
        </div>
        <!-- Telemetry & Log Section -->
        <div class="w-full md:w-80 flex flex-col justify-between bg-white dark:bg-gray-900 rounded-xl m-4 p-4 shadow-lg">
            <div>
                <h2 class="text-lg font-bold mb-2 text-blue-900 dark:text-blue-200">البيانات اللحظية (Telemetry)</h2>
                <ul class="space-y-1 text-sm" id="telemetry">
                    <li>البطارية: <span id="battery">98%</span></li>
                    <li>الرياح: <span id="wind">7 كم/س</span></li>
                    <li>الحالة: <span id="status">جاهز</span></li>
                </ul>
            </div>
            <div class="mt-6">
                <h2 class="text-lg font-bold mb-2 text-blue-900 dark:text-blue-200">سجل الأحداث</h2>
                <div id="event-log" class="bg-gray-100 dark:bg-gray-800 rounded p-2 h-40 overflow-y-auto text-xs"></div>
            </div>
        </div>
    </div>
    <script>
        // Demo logic
        let missionStarted = false;
        let intruderVisible = false;
        let jammed = false;
        function logEvent(msg) {
            const log = document.getElementById('event-log');
            log.innerHTML = `<div>${new Date().toLocaleTimeString('ar-EG')}: ${msg}</div>` + log.innerHTML;
        }
        function startMission() {
            missionStarted = true;
            document.getElementById('status').innerText = 'مهمة جارية';
            document.getElementById('drone1').style.top = '120px';
            document.getElementById('drone1').style.left = '300px';
            logEvent('بدأت الدرون مهمة الفحص الروتيني.');
        }
        function showIntruder() {
            if (!missionStarted) { logEvent('يجب بدء المهمة أولاً.'); return; }
            intruderVisible = true;
            document.getElementById('intruder').classList.remove('hidden');
            logEvent('تم رصد درون معادٍ يقترب من المنطقة المحظورة!');
            document.getElementById('status').innerText = 'تهديد مكتشف';
        }
        function activateJamming() {
            if (!intruderVisible) { logEvent('لا يوجد هدف للتشويش عليه.'); return; }
            jammed = true;
            document.getElementById('jam-effect').classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('intruder').style.top = '260px';
                document.getElementById('intruder').style.left = '100px';
                document.getElementById('status').innerText = 'تم التشويش';
                logEvent('تم تفعيل التشويش الإلكتروني وتعطيل الدرون المعادي.');
                setTimeout(() => {
                    document.getElementById('jam-effect').classList.add('hidden');
                }, 800);
            }, 700);
        }
        function resetDemo() {
            missionStarted = false;
            intruderVisible = false;
            jammed = false;
            document.getElementById('drone1').style.top = '60px';
            document.getElementById('drone1').style.left = '60px';
            document.getElementById('intruder').classList.add('hidden');
            document.getElementById('intruder').style.top = '180px';
            document.getElementById('intruder').style.left = '320px';
            document.getElementById('status').innerText = 'جاهز';
            document.getElementById('event-log').innerHTML = '';
            document.getElementById('jam-effect').classList.add('hidden');
        }
    </script>
</body>
</html>
